services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-container
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ../services/user/.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_listener", "5672"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  user-service:
    build: ../services/user
    env_file:
      - ../services/user/.env
    ports:
      - "5050:80"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy



volumes:
  redis-data:
  rabbitmq_data:
